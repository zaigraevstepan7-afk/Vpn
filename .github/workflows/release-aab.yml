name: Release AAB (Google Play)

# Builds the Android App Bundle for Play. Run manually or by pushing a v* tag.
# If signing secrets are configured (see README → "Публикация в Google Play"),
# the bundle is signed and ready to upload; otherwise an unsigned bundle is
# produced for inspection.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch native Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 4 --retry-delay 4 \
            -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.6.2/libv2ray.aar"

      - name: Build release bundle
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign bundle (if a keystore secret is configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          jarsigner -keystore upload.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f upload.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootVPN-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
